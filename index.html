<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
        <title>The Unit Conversion Machine</title>
        <script src="index.js" defer></script>
    </head>
    <body>
        <main>
            <div id="container-div">

                <div id="input-div">
                <h1>Metric/Imperial Unit Conversion</h1>
                    <input id="number-input" type="number">
                    <button id="convert-btn">Convert</button> 
                </div>
                
                <div id="results-container-div">
                    <div class="results-div" id="length-div">
                        <h2>Length (Meter/Feet)</h2>
                        <p class="results-p" id="length-p"></p>
                    </div>
                    <div class="results-div" id="volume-div">
                        <h2>Volume (Liters/Gallons)</h2>
                        <p class="results-p" id="volume-p"></p>
                    </div>
                    <div class="results-div" id="mass-div">
                        <h2>Mass (Kilograms/Pounds)</h2>
                        <p class="results-p" id="mass-p"></p>
                    </div>
                </div>
            
            </div>   
        </main>
            <div class="modal" id="modal">

		        <!-- <div class="close-modal-btn-container">
			        <button class="modal-close-btn" id="modal-close-btn" disabled>X</button>
		        </div> -->

		        <div class="modal-inner" id="modal-inner">
                    <div>
                       <h2>Annoying Modal Sample</h2>
                        <p class="modal-text" id="modal-text">This is a sample modal, buttons switch place so you can't ever decline.</p>
                        <p class="modal-text">It disappears after 10 seconds.</p>
                        <form id="consent-form">
                
                            <!-- <input type="text" name="fullName" placeholder="Enter your full name" required="">
                            <input type="email" name="email" placeholder="Enter your email" required=""> -->

                            <div class="modal-choice-btns" id="modal-choice-btns">
                                <button type="submit" class="modal-btn" id="modal-btn">Accept</button>
                                <button class="modal-btn" id="decline-btn">Decline</button>
                            </div>

                        </form> 
                    </div>
			        
		    </div>
	        </div>
    </body>
</html>
